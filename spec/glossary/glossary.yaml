- id: bullion
  term: Bullion
  layer: CORE
  kind: instrument
  aspects:
  - A01
  definition: Physical coins or bars valued by metal content; LBMA "good delivery" defines accepted purity and weight
    standards for large bars.
  synonyms:
  - physical gold
  - good delivery bar
  deprecated_synonyms: []
  related:
  - gold-asset
  sources:
  - S28
  notes: 'Includes ''Bullion Premium'': Amount paid above spot for a coin or bar (minting plus dealer margin); falls
    with bar size (1 oz coin ~3-8%, small bars 5-15%+, 1 kg bar ~1-3%). Includes ''Allocated Gold'': Specific numbered
    bars held in the owner''s name and off the custodian''s balance sheet; unallocated gold is a paper claim that
    makes the owner an unsecured creditor.'
- id: bullion-premium
  term: Bullion Premium
  layer: CORE
  kind: concept
  aspects:
  - A01
  definition: Amount paid above spot for a coin or bar (minting plus dealer margin); falls with bar size.
  synonyms: []
  deprecated_synonyms: []
  related: []
  sources:
  - S28
- id: buy-stop-order
  term: Buy-Stop Order
  layer: CORE
  kind: order-type
  aspects:
  - A01
  - A06
  definition: Conditional buy order that triggers when price rises to a level above the current market, used to
    enter only if a breakout occurs.
  synonyms:
