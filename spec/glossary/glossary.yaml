- id: overnight-gap-test
  term: Overnight-Gap Test
  layer: METHOD
  kind: rule-concept
  aspects:
  - A08
  definition: 'Weight cap: the portfolio loss from an assumed overnight gap (weight x gap%) must stay within 2%
    of equity; assumed gap 30% for a single stock (weight <= 6.67%) and 15% for funds and baskets (weight <= 13.33%).'
  synonyms: []
  deprecated_synonyms: []
  parameters:
    gap_pct_stock: 30
    gap_pct_fund: 15
    max_gap_loss_pct: 2
    max_weight_pct_stock: 6.67
    max_weight_pct_fund: 13.33
  formula: weight * gap_pct <= max_gap_loss_pct
  related:
  - gap
  - risk-based-position-sizing
  - single-position-impact
  sources:
  - S13
  - S25
  decisions:
  - D-C09
  - D-OPEN-3
  - D-R12
  notes: 'Source example: 10% weight x 30% gap = 3% of account (fails). Values decided by D-OPEN-3 (A08 `risk.gap_*`);
    only stricter settings are allowed. Existing positions: breach flagged immediately; trim-to-cap agenda item
    when the weight exceeds 1.5 x the cap or the breach is not from gains (D-R12).'
