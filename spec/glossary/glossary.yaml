  - S13
- id: financial-instrument
  term: Financial Instrument
  layer: CORE
  kind: entity
  aspects:
  - A01
  definition: A tradable asset identified by a ticker/ISIN on a market (stock, fund, bond, future, option, commodity
    product). Carries price and volume history, currency, market, classification and liquidity attributes.
  synonyms:
  - instrument
  - security
  deprecated_synonyms: []
  related:
  - stock
  - exchange-traded-fund
  - bond
  - market
  see_also_entities:
