  id: liquidity-floor
  term: Liquidity Floor
  layer: CORE
  kind: rule-concept
  aspects:
  - A01
  definition: 'Minimum tradability: stocks need a 20-session average daily traded value >= $5M (USD equivalent);
    ETFs need AUM >= $100M and average daily traded value >= $2M.'
  parameters:
    stock_min_adv_usd: 5000000
    etf_min_aum_usd: 100000000
    etf_min_adv_usd: 2000000
  decisions:
