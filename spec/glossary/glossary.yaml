- id: market-on-open-order
  term: Market-on-Open Order
  layer: CORE
  kind: order-type
  aspects:
  - A01
  - A07
  definition: Order executed in the opening auction of the next session at the opening price, without price guarantee;
    used for every next-session exit while the protective stop stays live. The limit-on-open variant fills only
    at or better than its limit (used for close-confirmed entries).
  synonyms:
  - MOO
  - market on open
  - limit-on-open (variant)
