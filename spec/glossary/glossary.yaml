- id: extended-hours-trading
  term: Extended-Hours Trading
  layer: CORE
  kind: concept
  aspects:
  - A01
  - A04
  definition: Trading in pre-market and after-hours sessions. Moves there are not reflected in the regular-session
    candle colour, so an overnight drop can produce a misleading green daily candle.
  synonyms:
  - pre-market
  - after-hours
  - candle colour warning
  deprecated_synonyms: []
