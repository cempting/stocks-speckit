    can have different tickers per market and wrapper.'
- id: fund-size
  term: Fund Size (AUM)
  layer: CORE
  kind: metric
  aspects:
  - A01
  definition: Assets under management of a fund; larger funds tend to be more liquid and stable.
  synonyms:
