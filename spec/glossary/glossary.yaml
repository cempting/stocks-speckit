  - S07
- id: cap-weighted-index
  term: Cap-Weighted Index
  layer: CORE
  kind: classification
  aspects:
  - A01
  - A09
  definition: Index in which constituent weight is proportional to market capitalization, so the largest companies
    dominate its behaviour.
  synonyms:
