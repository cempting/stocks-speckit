- id: liquidity
  term: Liquidity
  layer: CORE
  kind: metric
  aspects:
  - A01
  definition: Ease of trading an instrument without moving its price, typically measured by average daily volume
    or average daily dollar volume.
  synonyms:
  - tradability
  - average dollar volume
  deprecated_synonyms: []
  unit: shares/day or currency/day
  related:
