- id: exchange-traded-commodity
  term: Exchange-Traded Commodity (ETC)
  layer: CORE
  kind: instrument
  aspects:
  - A01
  definition: Exchange-traded note-like product backed (typically 1:1) by a physical commodity such as gold; the
    European route to single-commodity exposure because it is not a UCITS fund.
  synonyms:
  - ETC
  deprecated_synonyms: []
  related:
  - ucits
  - gold-asset
  - bullion
  sources:
  - S28
- id: exchange-traded-fund
  term: Exchange-Traded Fund (ETF)
  layer: CORE
  kind: instrument
  aspects:
  - A01
  definition: A fund holding a basket of securities (stocks, bonds or commodities) that trades on an exchange like
    a share. Reduces single-company risk but not the risk of the sector/theme it holds; availability, tickers, fees
    and eligibility differ by country.
  synonyms:
  - ETF
  - exchange traded fund
  - fund
  deprecated_synonyms: []
  related:
  - index-fund
  - ucits
  - basket
  - expense-ratio
  - look-through-exposure
  see_also_entities:
  - Instrument
  - Fund
  sources:
  - S02
  - S05
  - S08
  - S09
  - S10
  - S13
  - S25
  - S28
  - S30
  notes: 'Includes ''Futures-Based ETF'': ETF that obtains exposure via futures contracts and may diverge from the
    spot price of the underlying. Includes ''Bond ETF'': Exchange-traded fund holding bonds; can trade at a discount
    to NAV under stress.'
- id: expense-ratio
  term: Expense Ratio
  layer: CORE
  kind: metric
  aspects:
