- id: withholding-tax
  term: Withholding Tax
  layer: CORE
  kind: concept
  aspects:
  - A01
  definition: Tax deducted at source on dividends/interest paid to foreign holders; Irish-domiciled UCITS funds
    pay 15% instead of 30% on US-source income under treaty. Non-US holders of US-domiciled assets may also face
    US estate tax above USD 60,000.
  synonyms:
  - dividend withholding
  - US estate-tax trap
  deprecated_synonyms: []
  related:
  - isin-domicile
  - tax-wrapper
  sources:
  - S09
  - S21
