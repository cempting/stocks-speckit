- id: ucits
  term: UCITS Fund
  layer: CORE
  kind: instrument
  aspects:
  - A01
  definition: European regulated fund wrapper that EU/UK retail investors can buy; US-listed ETFs are generally
    not available to them. UCITS rules require diversification, so single-commodity products are ETCs instead.
