- id: broker
  term: Broker
  layer: CORE
  kind: role
  aspects:
  - A01
  definition: Intermediary that holds the account, routes orders to exchanges and provides charting and alerts.
    Choice is free; an existing broker is acceptable.
  synonyms:
  - brokerage
  - trading platform
  deprecated_synonyms: []
  related:
  - order
  - price-alert
  - net-selling
  see_also_entities:
