- id: index-inclusion-effect
  term: Index Inclusion Effect
  layer: CORE
  kind: event
  aspects:
  - A01
  - A04
  definition: When a large company joins an index, tracking funds must buy it and trim all other holdings; the ejected
    stock and thin, low-volume names are hit hardest.
  synonyms:
  - the SpaceX effect
  deprecated_synonyms: []
  related:
  - market-index
  - ipo
  - institutional-tailwind
  sources:
  - S03
- id: ipo
  term: Initial Public Offering (IPO)
  layer: CORE
  kind: event
  aspects:
  - A01
  - A05
  definition: First listing and sale of a company's shares on an exchange. Has no price history, so no heartbeat
    or moving-average signal can exist yet.
  synonyms:
  - IPO
  - listing
  deprecated_synonyms: []
  related:
  - ipo-trap
  - heartbeat
  sources:
  - S03
- id: isin-domicile
  term: ISIN / Fund Domicile
  layer: CORE
  kind: concept
  aspects:
  - A01
  definition: ISIN is the international security identifier; its country prefix shows the domicile (IE = Ireland,
    LU = Luxembourg), which determines tax treatment such as dividend withholding.
  synonyms:
  - ISIN prefix
  - domicile
  deprecated_synonyms: []
