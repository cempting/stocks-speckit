- id: nav-discount
  term: NAV Discount
  layer: CORE
  kind: metric
  aspects:
  - A01
  - A10
  definition: Amount by which a fund's market price trades below the value of its holdings (NAV); can widen for
    bond ETFs under stress.
  synonyms:
  - price deviation from NAV
  deprecated_synonyms: []
  unit: '%'
  related:
  - exchange-traded-fund
  sources:
  - S09
- id: option
  term: Option
  layer: CORE
  kind: instrument
  aspects:
  - A01
  definition: Contract giving the right but not the obligation to buy (call) or sell (put) an asset at a strike
    price until expiry.
  synonyms:
  - Call Option
  - call
  - mechanical price amplifier
  - Put Option
  - put
  - selling a put
  - cash-secured put
  deprecated_synonyms: []
  related: []
  sources:
  - S27
  - S29
  notes: 'Includes ''Call Option'': Option paying off if price rises above the strike; surging call demand can mechanically
    amplify a price move as dealers hedge. Includes ''Put Option'': Option giving the right to sell at a fixed price
    (insurance against a fall). Selling a put collects a premium in exchange for the obligation to buy at the strike.
    Includes ''Probability of Profit'': Estimated chance that an options trade makes at least some money by expiry,
    from typical price movement.'
- id: order
  term: Order
  layer: CORE
  kind: entity
  aspects:
  - A01
