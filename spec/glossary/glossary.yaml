  - A08
  definition: Fund that targets a multiple (2x/3x, or single-stock leverage) of an underlying's daily return; can
    lose value very fast. Excluded by the method (no leverage).
  synonyms:
  - leveraged index fund
  - 2x/3x ETF
  deprecated_synonyms: []
