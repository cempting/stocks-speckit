  definition: Fund share class that hedges the fund's currency exposure back to the share-class currency.
  synonyms: []
  deprecated_synonyms: []
  related: []
  sources:
  - S09
- id: equal-weight-index
  term: Equal-Weight Index
  layer: CORE
  kind: classification
  aspects:
  - A01
  - A09
  definition: Index (or fund) in which each constituent has the same weight, so smaller names count more than in
    a cap-weighted index (e.g. RSP for the S&P 500).
