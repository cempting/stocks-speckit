- id: ma-slope
  term: Moving-Average Slope
  layer: CORE
  kind: indicator
  aspects:
  - A02
  - A06
  - A07
  definition: 'State of a moving average (rising / flat / falling) from the normalized linear-regression slope of
    the SMA over the last N sessions: rising if above the flat band, falling if below minus the band, otherwise
    flat; undefined (treated as not rising) with fewer than N values (A02 R-A02-025/026). Never buy when the slope
    is down.'
  synonyms:
  - slope
  - rising/falling line
  deprecated_synonyms: []
  parameters:
    window_sessions_N: 20 (scoreboard.ma_slope_window_sessions)
    flat_band_pct_per_session: 0.025 (scoreboard.ma_slope_flat_band_pct)
  formula: b = OLS slope of SMA[t-N+1..t] on x = 0..N-1; slope_norm_pct = b / SMA(t) * 100; rising if slope_norm_pct
    > band, falling if < -band, else flat
  related:
  - simple-moving-average
  - rising-50-sma
  - falling-knife
  sources:
  - S07
  - S13
  - S25
  - S30
  decisions:
