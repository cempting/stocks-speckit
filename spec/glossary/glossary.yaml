  definition: 'Classification of a smart-money panel: STRONG BUYING when >= 2 independent sources are positive within
    90 days (ETF inflow > 5 % of AUM over 4 weeks; 13F ownership +>= 2 pp QoQ; >= 2 insider open-market buys; >=
    2 congressional buys); HEAVY SELLING when >= 3 insider open-market sells within 30 days or 13F ownership down
    >= 3 pp QoQ.'
