[project]
name = "market-data"
version = "0.1.0"
description = "Shared reviewed market contracts, validation and file persistence"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jsonschema[format]>=4.25,<5",
  "numpy>=2.2,<3",
  "pandas>=2.2,<3",
  "python-dotenv>=1.1,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_data"]
artifacts = ["src/market_data/schemas/*.json"]
