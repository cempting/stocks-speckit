name: Data contract compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-packages
      - run: uv run ruff check src packages services tests
      - run: uv run pyright
      - name: Verify producers, contracts, and app consumption without live services
        run: uv run pytest -m "not live" -q
      - run: uv build --all-packages --wheel
