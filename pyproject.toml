[project]
name = "market-leadership"
version = "0.1.0"
description = "Market leadership discovery screener"
requires-python = ">=3.12,<3.13"
dependencies = [
  "altair>=5.5,<6",
  "exchange-calendars>=4.11,<5",
  "jsonschema[format]>=4.25,<5",
  "massive>=2.9,<3",
  "numpy>=2.2,<3",
  "pandas>=2.2,<3",
  "pyarrow>=20,<27",
  "python-dotenv>=1.1,<2",
  "streamlit>=1.50,<2",
  "yfinance>=0.2.66,<1",
]

[dependency-groups]
dev = [
  "pyright>=1.1.407,<2",
  "pytest>=8.4,<9",
  "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_leadership"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "live: tests that call external market-data services",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".specify", "docs/tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src"]